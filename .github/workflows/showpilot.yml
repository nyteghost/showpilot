name: ShowPilot standalone checks
run-name: "ShowPilot ${{ github.ref_name }} build #${{ github.run_number }}"
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
concurrency:
  group: showpilot-${{ github.ref_name }}-validation
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - name: Stamp unique Main/Beta build version
        env:
          SHOWPILOT_BUILD_CHANNEL: ${{ github.ref_name }}
          SHOWPILOT_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-build-version.mjs
      - run: bun run check
      - run: node --check desktop/main.cjs && node --check desktop/preload.cjs && node --check desktop/google-calendar.cjs && node --check desktop/ai-vault.cjs && node --check desktop/app-updates.cjs && node --check desktop/showpilot-memory.cjs && node --check desktop/secure-storage.cjs && node --check desktop/portable-updates.cjs && node --check desktop/today-checklist.cjs
      - run: bun test
      - run: bun run build
      - name: Upload offline browser build
        uses: actions/upload-artifact@v4
        with:
          name: showpilot-browser-beta
          path: dist/
  windows-portable:
    needs: check
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - name: Stamp unique Main/Beta build version
        env:
          SHOWPILOT_BUILD_CHANNEL: ${{ github.ref_name }}
          SHOWPILOT_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-build-version.mjs
      - run: bun run build
      - name: Package portable Windows application
        run: bunx electron-builder --win dir --x64 --publish never
      - name: Create versioned portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/ShowPilot-v${version}-Portable-Windows.zip" -Force
      - name: Test Windows in-place updater staging against actual portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $archive = (Resolve-Path "release/ShowPilot-v${version}-Portable-Windows.zip").Path
          $workspace = Join-Path $env:RUNNER_TEMP "showpilot-updater-smoke"
          $oldApp = Join-Path $workspace "OriginalApp"
          $stage = Join-Path $workspace ".showpilot-next-smoke"
          New-Item -ItemType Directory -Path $oldApp,$stage -Force | Out-Null
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "desktop/portable-update-helper.ps1" -Mode Stage -InstallDir $oldApp -StageDir $stage -ArchivePath $archive -LogPath (Join-Path $workspace "update-test.log")
          if ($LASTEXITCODE -ne 0) { throw "Windows portable update staging failed." }
          if (-not (Test-Path (Join-Path $stage "ShowPilot.exe"))) { throw "Staged executable is missing." }
      - name: Test Windows installer startup handshake, then isolated swap and rollback
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "showpilot-updater-smoke"
          $oldApp = Join-Path $workspace "OriginalApp"
          $stage = Join-Path $workspace ".showpilot-next-smoke"
          $backup = Join-Path $workspace ".showpilot-previous-smoke"
          $log = Join-Path $workspace "update-swap-test.log"
          New-Item -ItemType Directory -Path (Join-Path $oldApp "resources") -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $stage "ShowPilot.exe") -Destination (Join-Path $oldApp "ShowPilot.exe")
          Copy-Item -LiteralPath (Join-Path $stage "resources/app.asar") -Destination (Join-Path $oldApp "resources/app.asar")
          Set-Content -LiteralPath (Join-Path $oldApp "previous-version-marker.txt") -Value "Old version must remain in backup."
          $env:SHOWPILOT_UPDATER_SMOKE_TEST = "1"
          & node scripts/test-detached-updater-handshake.cjs $workspace
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $log) { Get-Content -LiteralPath $log -Tail 40 }
            throw "Windows PowerShell launcher failed to reach its validated startup handshake."
          }
          # The detached helper was deliberately stopped after readiness:
          # a GitHub runner cannot faithfully simulate a surviving user desktop
          # process across its managed step boundary.
          Start-Sleep -Milliseconds 500
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "desktop/portable-update-helper.ps1" -Mode Install -InstallDir $oldApp -StageDir $stage -BackupDir $backup -AppProcessId 2147483000 -LogPath $log -SmokeTestNoRelaunch
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $log) { Get-Content -LiteralPath $log -Tail 45 }
            throw "Isolated Windows installer folder swap failed."
          }
          if (-not (Test-Path (Join-Path $oldApp "ShowPilot.exe"))) { throw "Updated executable missing." }
          if (-not (Test-Path (Join-Path $backup "previous-version-marker.txt"))) { throw "Previous app backup missing." }
          if (Test-Path $stage) { throw "Staged update was not consumed." }
      - uses: actions/upload-artifact@v4
        with:
          name: showpilot-windows-portable
          path: release/ShowPilot-v*-Portable-Windows.zip
          if-no-files-found: error
  publish-beta-windows:
    # Private download tokens are not required on employees' work PCs:
    # publish the already-checked portable ZIP as a public GitHub Release.
    # This job runs only on beta after the Windows package completes.
    if: github.ref == 'refs/heads/beta'
    needs: windows-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: showpilot-windows-portable
          path: portable/
      - name: Publish versioned beta release and SHA-256 checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOWPILOT_BUILD_CHANNEL: beta
          SHOWPILOT_BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/stamp-build-version.mjs
          version="$(node -p 'require("./package.json").version')"
          archive="portable/ShowPilot-v${version}-Portable-Windows.zip"
          checksum="${archive}.sha256"
          test -s "$archive"
          sha256sum "$archive" | awk '{print $1}' > "$checksum"
          tag="showpilot-beta-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$tag" "$archive" "$checksum" \
            --target "$SOURCE_SHA" \
            --title "ShowPilot Beta v${version} (Windows portable)" \
            --notes "ShowPilot beta Windows portable release. Actions run ID: ${SOURCE_RUN_ID}. Source commit: ${SOURCE_SHA}. Update the app through Settings & AI > App Updates. The existing local SQLite data stays outside the application." \
            --prerelease --latest=false

  linux-portable:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - name: Stamp identical release number for Linux
        env:
          SHOWPILOT_BUILD_CHANNEL: ${{ github.ref_name }}
          SHOWPILOT_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-build-version.mjs
      - run: bun run build
      - name: Package Linux x86_64 portable archive
        run: bunx electron-builder --linux tar.gz --x64 --publish never
      - name: Inspect Linux archive and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release/ShowPilot-v*-Linux-x86_64.tar.gz)
          test "${#archives[@]}" -eq 1
          tar -tzf "${archives[0]}" > release/linux-archive-contents.txt
          grep -Eq "(^|/)showpilot$" release/linux-archive-contents.txt
          (cd release && sha256sum ShowPilot-v*-Linux-x86_64.tar.gz > ShowPilot-Linux-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: showpilot-linux-portable
          path: |
            release/ShowPilot-v*-Linux-x86_64.tar.gz
            release/ShowPilot-Linux-SHA256SUMS.txt
          if-no-files-found: error
  linux-appimage:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - name: Stamp identical release number for Linux AppImage
        env:
          SHOWPILOT_BUILD_CHANNEL: ${{ github.ref_name }}
          SHOWPILOT_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-build-version.mjs
      - run: bun run build
      - name: Package Linux x86_64 AppImage
        run: bunx electron-builder --linux AppImage --x64 --publish never
      - name: Inspect AppImage and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(release/ShowPilot-v*-Linux-x86_64.AppImage)
          test "${#images[@]}" -eq 1
          file "${images[0]}" | grep -q ELF
          (cd release && sha256sum ShowPilot-v*-Linux-x86_64.AppImage > ShowPilot-Linux-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: showpilot-linux-appimage
          path: |
            release/ShowPilot-v*-Linux-x86_64.AppImage
            release/ShowPilot-Linux-SHA256SUMS.txt
          if-no-files-found: error

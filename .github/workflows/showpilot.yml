name: ShowPilot standalone checks
run-name: "ShowPilot ${{ github.ref_name }} build #${{ github.run_number }}"
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
concurrency:
  group: showpilot-${{ github.ref_name }}-validation
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - name: Stamp unique Main/Beta build version
        env:
          SHOWPILOT_BUILD_CHANNEL: ${{ github.ref_name }}
          SHOWPILOT_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-build-version.mjs
      - run: bun run check
      - run: node --check desktop/main.cjs && node --check desktop/preload.cjs && node --check desktop/google-calendar.cjs && node --check desktop/ai-vault.cjs && node --check desktop/app-updates.cjs && node --check desktop/showpilot-memory.cjs && node --check desktop/secure-storage.cjs
      - run: bun test
      - run: bun run build
      - name: Upload offline browser build
        uses: actions/upload-artifact@v4
        with:
          name: showpilot-browser-beta
          path: dist/
  windows-portable:
    needs: check
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - name: Stamp unique Main/Beta build version
        env:
          SHOWPILOT_BUILD_CHANNEL: ${{ github.ref_name }}
          SHOWPILOT_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-build-version.mjs
      - run: bun run build
      - name: Package portable Windows application
        run: bunx electron-builder --win dir --x64 --publish never
      - name: Create versioned portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/ShowPilot-v${version}-Portable-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: showpilot-windows-portable
          path: release/ShowPilot-v*-Portable-Windows.zip
          if-no-files-found: error

  linux-portable:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - name: Stamp identical release number for Linux
        env:
          SHOWPILOT_BUILD_CHANNEL: ${{ github.ref_name }}
          SHOWPILOT_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-build-version.mjs
      - run: bun run build
      - name: Package Linux x86_64 AppImage and portable tar.gz
        run: bunx electron-builder --linux AppImage tar.gz --x64 --publish never
      - name: Inspect Linux packages and create checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(release/ShowPilot-v*-Linux-x86_64.AppImage)
          archives=(release/ShowPilot-v*-Linux-x86_64.tar.gz)
          test "${#images[@]}" -eq 1
          test "${#archives[@]}" -eq 1
          file "${images[0]}" | grep -q ELF
          tar -tzf "${archives[0]}" > release/showpilot-linux-file-list.txt
          grep -Eq '(^|/)showpilot
      - uses: actions/upload-artifact@v4
        with:
          name: showpilot-linux-appimage
          path: |
            release/ShowPilot-v*-Linux-x86_64.AppImage
            release/ShowPilot-Linux-SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: showpilot-linux-portable
          path: |
            release/ShowPilot-v*-Linux-x86_64.tar.gz
            release/ShowPilot-Linux-SHA256SUMS.txt
          if-no-files-found: error
 release/showpilot-linux-file-list.txt
          (cd release && sha256sum ShowPilot-v*-Linux-x86_64.AppImage ShowPilot-v*-Linux-x86_64.tar.gz > ShowPilot-Linux-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: showpilot-linux-appimage
          path: |
            release/ShowPilot-v*-Linux-x86_64.AppImage
            release/ShowPilot-Linux-SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: showpilot-linux-portable
          path: |
            release/ShowPilot-v*-Linux-x86_64.tar.gz
            release/ShowPilot-Linux-SHA256SUMS.txt
          if-no-files-found: error

name: Bootstrap reproducible Bun lockfile (claude only)
on:
  push:
    branches: [claude]
    paths: [".github/workflows/claude-bun-lock.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-bun-lock
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref_name == 'claude'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Generate lockfile from current package.json
        run: bun install --lockfile-only
      - name: Commit lockfile on claude only
        shell: bash
        run: |
          test -s bun.lock || { echo "Bun lockfile was not created"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock is already current"
          else
            git commit -m "build(claude): pin Bun dependency graph in bun.lock"
            git push origin HEAD:claude
          fi

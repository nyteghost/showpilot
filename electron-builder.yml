appId: com.showpilot.worktools
productName: ShowPilot
asar: true
directories:
  output: release
files:
  - dist/**
  - desktop/**
  - node_modules/sql.js/package.json
  - node_modules/sql.js/dist/sql-wasm-inline.js
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
win:
  icon: desktop/showpilot.ico
  target:
    - target: dir
      arch:
        - x64
linux:
  executableName: showpilot
  icon: desktop/linux-icons
  category: Office
  synopsis: Offline-first Show Services planning and scheduling
  artifactName: "ShowPilot-v${version}-Linux-x86_64.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
# electron-builder 26 static AppImage runtime avoids the old libfuse2
# dependency that is frequently missing on Arch/CachyOS.
toolsets:
  appimage: "1.0.3"
